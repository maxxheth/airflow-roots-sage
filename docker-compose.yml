services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.6
    container_name: traefik_airflow
    command:
      # API and Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Docker Provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=airflow-roots-sage_web"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Logging
      - "--log.level=DEBUG"
      # Dynamic Configuration
      - "--providers.file.directory=/etc/traefik/conf.d"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic_conf.yml:/etc/traefik/conf.d/ssl.yml:ro
      - ./docker/traefik/certs:/etc/traefik/certs:ro
    networks:
      - web
    restart: unless-stopped

  # WordPress (PHP-FPM + Nginx)
  wordpress:
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
      target: development
    container_name: wp_airflow
    volumes:
      - ./bedrock:/var/www/html
    # Note: depends_on for mysql moved to docker-compose.override.yml for local dev
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=mysql
      - WP_ENV=${WP_ENV:-development}
      - WP_HOME=${WP_HOME}
      - WP_SITEURL=${WP_SITEURL}
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      # HTTP Router (redirects to HTTPS via Traefik global config)
      - "traefik.http.routers.wp_airflow.rule=Host(`${DOMAIN:-airflow.localhost}`)"
      - "traefik.http.routers.wp_airflow.entrypoints=web"
      # HTTPS Router
      - "traefik.http.routers.wp_airflow-secure.rule=Host(`${DOMAIN:-airflow.localhost}`)"
      - "traefik.http.routers.wp_airflow-secure.entrypoints=websecure"
      - "traefik.http.routers.wp_airflow-secure.tls=true"
      # Service Configuration
      - "traefik.http.services.wp_airflow.loadbalancer.server.port=80"
      - "traefik.docker.network=airflow-roots-sage_web"

  # MySQL Database
  mysql:
    image: mysql:8.0
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3312:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Node (Vite Dev Server for Sage)
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
    volumes:
      - ./bedrock/web/app/themes/sage:/app
      - /app/node_modules
      - ./docker/traefik/certs:/app/certs:ro
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    networks:
      - web

networks:
  web:
    driver: bridge
  internal:
    driver: bridge

volumes:
  mysql_data:
