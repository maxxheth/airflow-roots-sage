# Production overrides for remote server deployment
# Designed to work with external Traefik, MySQL, and Redis services

services:
  wordpress:
    build:
      target: production
    container_name: wp_airflow
    user: "33:33"
    volumes:
      # Docker socket for external service integration
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Bedrock application files
      - ./bedrock:/var/www/html
      # Shared mu-plugins from server
      - /var/opt/shared/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Application logs
      - ./log:/var/www/log
    environment:
      # Bedrock-style (for Bedrock/Sage compatibility)
      - WP_ENV=production
      - WP_HOME=https://${DOMAIN}
      - WP_SITEURL=https://${DOMAIN}/wp
      - WP_DEBUG=${WP_DEBUG:-false}
      - WP_DEBUG_LOG=${WP_DEBUG_LOG:-true}
      - WP_DEBUG_DISPLAY=false
      - WP_CACHE=${WP_CACHE:-true}
      # WordPress-style (for external services expecting these vars)
      - WORDPRESS_DB_HOST=${DB_HOST:-mysql}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD}
      - WORDPRESS_DB_NAME=${DB_NAME}
      # Redis cache configuration
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB_INDEX=${REDIS_DB_INDEX:-0}
      # Resource settings
      - MEMORY_LIMIT=${MEMORY_LIMIT:-512M}
      - PAGER=more
    networks:
      - web
      - mysql
      - cache
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/wp/wp-admin/install.php" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: ${MEMORY_LIMIT:-512M}
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      # Grouping labels for management
      - "ci.groups=website,wordpress"
      # Traefik configuration
      - "traefik.enable=true"
      - "traefik.http.routers.wp_airflow.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.wp_airflow.tls=true"
      - "traefik.http.routers.wp_airflow.tls.certresolver=lets-encrypt"
      - "traefik.http.routers.wp_airflow.middlewares=wordpress-security"
      - "traefik.port=80"
      - "traefik.docker.network=web"
      # Prometheus/PromPress monitoring
      - "prompress.enabled=true"
      - "prompress.path=wp-json/prompress/v1/metrics"
    # Override depends_on - production uses external MySQL
    depends_on: []

  # MySQL is disabled in production (uses external database)
  # This overrides the base mysql service with a "disabled" profile
  mysql:
    image: mysql:8.0
    profiles:
      - disabled
    # Override networks to prevent conflicts
    networks:
      - mysql

  # Node service for building production assets
  # Runs once to compile assets, then exits
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: builder
    profiles:
      - build
    volumes:
      - ./bedrock/web/app/themes/sage:/app
      - /app/node_modules
    command: npm run build

# Production uses external networks from the server
networks:
  cache:
    external: true
    name: cache
  mysql:
    external: true
    name: mysql
  web:
    external: true
    name: web
