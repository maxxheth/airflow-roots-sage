services:
    wp_jsjinc:
        image: ghcr.io/ciwebgroup/advanced-wordpress:latest
        container_name: wp_jsjinc
        environment:
            - PAGER=more
            - MEMORY_LIMIT=1G
            - REDIS_DB_INDEX=0
            - WORDPRESS_DB_HOST=mysql
            - WORDPRESS_DB_USER=jsjinc
            - WORDPRESS_DB_PASSWORD=JyUA2dAkwsrdnElR
            - WORDPRESS_DB_NAME=wp_jsjinc
            - WP_HOME=https://www.jsj-inc.com
            - WP_DEBUG=true
            - WP_CACHE=true
            - WP_DEBUG_LOG=true
            - WP_DEBUG_DISPLAY=false
            - DOMAISCRIPT_DEBUG=true
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - ./robots.txt:/var/www/html/robots.txt:ro
            - ./www/wp-content/mysql.sql:/data/mysql.sql:ro
            - ./www/wp-content:/var/www/html/wp-content
            - /var/opt/shared/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
            - ./log:/var/www/log
        networks:
            - cache
            - web
            - mysql
        restart: unless-stopped
        labels:
            - ci.groups=website,wordpress
            - traefik.http.routers.wp_jsjinc.middlewares=wordpress-security
            - traefik.http.routers.wp_jsjinc.rule=Host(`jsj-inc.com`) || Host(`www.jsj-inc.com`)
            - traefik.http.routers.wp_jsjinc.tls=true
            - traefik.http.routers.wp_jsjinc.tls.certresolver=lets-encrypt
            - traefik.port=80
            - prompress.enabled=true
            - prompress.path=wp-json/prompress/v1/metrics
        deploy:
            resources:
                limits:
                    memory: 1G
        user: "33:33"
networks:
    cache:
        external: true
        name: cache
    mysql:
        external: true
        name: mysql
    web:
        external: true
        name: web

